<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoshidori &mdash; Hololive Dreams Unit Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <div>
        <h1 class="masthead-title">Hoshi<span class="spark">dori</span></h1>
      </div>
      <div class="masthead-right">
        <button id="music-viewer-btn" type="button" class="presets-btn">Music</button>
        <button id="card-viewer-btn" type="button" class="presets-btn">Card Viewer</button>
        <button id="activity-btn" type="button" class="presets-btn">Activity &#x1F52E;</button>
        <button id="cost-calc-btn" type="button" class="presets-btn">Level Cost Calc</button>
        <button id="compare-btn" type="button" class="presets-btn">Compare</button>
        <button id="presets-btn" type="button" class="presets-btn">Presets</button>
        <div class="masthead-sub">HOLOLIVE DREAMS &middot; UNIT SIMULATOR &middot; UNOFFICIAL</div>
      </div>
    </header>

    <!-- Row 1: Leader + 5 unit member selection cards -->
    <div class="member-grid selection-header">
      <div class="selection-header-label leader">Leader</div>
      <div class="selection-header-label members">Unit Members</div>
    </div>
    <div id="selection-row" class="member-grid selection-row"></div>

    <!-- Row 2: Leader info (skill/song/summary) + per-member stats/passive/active -->
    <div id="info-row" class="member-grid info-row"></div>

    <!-- Row 3: full-width coverage timeline, column-aligned to the grid above -->
    <div id="coverage-row" class="panel">
      <div class="empty-state">Select a leader and all 5 unit members to see results.</div>
    </div>

    <!-- Row 4: Overall Power estimate -->
    <div id="power-row"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
